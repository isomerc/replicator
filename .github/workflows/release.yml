name: Release

# Push a version tag to cut a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tests run first; if they fail, nothing is published. Then Linux,
# macOS (Intel + Apple Silicon) and Windows installers are built on
# native runners and attached to a DRAFT GitHub Release, so you get to
# look at it before anyone else does.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build a release for (e.g. v0.1.0)'
        required: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!()` embeds the built frontend at COMPILE
      # time, so dist/ has to exist before cargo runs - even for tests.
      # dist/ is gitignored, so CI must build it.
      - name: Build frontend
        run: pnpm build

      # Same set the flake installs for local dev. libasound2-dev is
      # required by rodio/cpal; without it the audio backend fails to
      # build rather than degrading gracefully.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Test
        working-directory: ./src-tauri
        run: cargo test --lib

      # Advisory only. A new Rust release can add lints, and that
      # shouldn't be able to block you from cutting a release - check
      # the log, don't get gated by it.
      - name: Clippy
        working-directory: ./src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.label }}
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            label: 'Linux'
            args: ''
          - platform: 'macos-latest'
            label: 'macOS (Apple Silicon)'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            label: 'macOS (Intel)'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            label: 'Windows'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file

      # git2 is built with vendored-openssl, and openssl-src needs NASM
      # to assemble on Windows. Perl already ships on the runner.
      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig) so
          # installed apps can verify updates came from this repo.
          # This is the project's own minisign key, not OS code
          # signing - SmartScreen/Gatekeeper warnings remain.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is encrypted with an EMPTY password - which is not
          # "no password". Without this set, the signer tries to prompt
          # a TTY that CI does not have and the build dies. Proven by
          # signing locally with and without it.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Replicator ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            Copy and version EVE Online UI settings across characters.

            **Linux** - `.AppImage` runs anywhere; `.deb` / `.rpm` for Debian/Ubuntu and Fedora.
            **macOS** - pick the Apple Silicon or Intel `.dmg` to match your Mac.
            **Windows** - the `-setup.exe` installer (installs per-user, no admin prompt).

            These builds are unsigned, so macOS and Windows will warn on first launch.
            The `latest.json` and `.sig` files serve the in-app updater; you don't need them.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
